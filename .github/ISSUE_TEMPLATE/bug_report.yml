name: Bug report
description: Report a reproducible defect without sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the defect and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal query, command, or test using simulated data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or release
      placeholder: v1.0.0 or commit SHA
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no credentials, internal enterprise data, or personal data.
          required: true
