name: Feature request
description: Propose a scoped Agent, evaluation, or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering or evaluation problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe code, tests, evaluation, documentation, and safety impact.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal can be implemented and evaluated with public or simulated data.
          required: true
